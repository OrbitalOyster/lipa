<div hx-swap-oob="beforeend:#toast-container">
	<div
		class="toast"
		data-bs-autohide="false"
		data-bs-delay="10000"
	>
		<!-- Time -->
		<div class="toast-header">
			<i class="bi me-2"></i>
			<strong class="me-auto">
				{{ .Title }}
			</strong>
			<small>
				{{ .Time }}
			</small>
			<button
				class="btn-close"
				type="button"
				data-bs-dismiss="toast"
			>
			</button>
		</div>
		<div class="toast-body">
			{{ .Content }}
		</div>
	</div>
</div>
