<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Bootstrap -->
		<link rel="stylesheet" href="/bootstrap/css/bootstrap.css" />
		<!-- Bootstrap icons -->
		<link
			rel="stylesheet"
			href="/bootstrap-icons/bootstrap-icons.min.css"
		/>
		<!-- css -->
		<link href="/css/style.css" rel="stylesheet" />
		<!-- htmx -->
		<script src="/htmx/htmx.min.js"></script>
		<title>
			{{ .Title }}
		</title>
	</head>
	<body class="bg-2 color-scheme-light">
		<!-- Firefox flashing layout voodoo hack -->
		<script>0;</script>
		<!-- Toasts -->
		<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container">
		</div>
		<!-- Actual content -->
		{{ template "page" . }}
	</body>
	<script type="module">
		import { initTooltips } from "/js/tooltips.js"
		import { initToasts } from "/js/toasts.js"
		initTooltips();
		initToasts();
	</script>
</html>
