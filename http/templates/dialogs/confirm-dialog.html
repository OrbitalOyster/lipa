{{ define "confirm-dialog.html" }}
	<dialog class="dialog dialog-slide-down" id="confirm-dialog">
		<div class="dialog-header">
			<h1 class="dialog-title" id="confirm-dialog-title"></h1>
			<button type="button" class="btn-close" data-bs-dismiss="dialog"></button>
		</div>
		<div class="dialog-body" id="confirm-dialog-content"></div>
		<div class="dialog-footer">
			<button
				type="button"
				class="btn-solid theme-secondary"
				data-bs-dismiss="dialog"
				id="confirm-dialog-cancel-btn"
			>
				<i class="bi bi-x-lg"></i>
				{{ l "Cancel" }}
			</button>
			<button
				type="button"
				class="btn-solid theme-primary"
				id="confirm-dialog-ok-btn"
			>
				<i class="bi bi-check2"></i>
				{{ l "Ok" }}
			</button>
		</div>
	</dialog>
{{ end }}
