{{ define "confirm-dialog" }}
	<dialog class="dialog dialog-slide-down" id="confirm-dialog">
		<div class="dialog-header">
			<h1 class="dialog-title" id="confirm-dialog-title">
				[INSERT TITLE]
			</h1>
			<button type="button" class="btn-close" data-bs-dismiss="dialog"></button>
		</div>
		<div class="dialog-body" id="confirm-dialog-content">
			[INSERT CONTENT]
		</div>
		<div class="dialog-footer">
			<button
				type="button"
				class="btn-solid theme-secondary"
				data-bs-dismiss="dialog"
				id="confirm-dialog-cancel-btn"
			>
				Cancel
			</button>
			<button
				type="button"
				class="btn-solid theme-primary"
				id="confirm-dialog-ok-btn"
			>
				Ok
			</button>
		</div>
	</dialog>
{{ end }}
