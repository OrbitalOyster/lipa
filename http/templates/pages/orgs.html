{{ define "page" }}
	<div class="card shadow-sm">
		<div class="card-header flex-row gap-4 align-items-center justify-content-between">
			{{ l "Orgs" }}
			<input type="text" class="form-control" autofocus>
		</div>
			<div class="list-group list-group-flush">
				{{ range .Orgs }}
					<a class="list-group-item list-group-item-action" href="/orgs/{{ .Id }}">{{ .Id }} - {{ .Name }}</a>
				{{ end }}
			</div>
		</div>
	</div>
{{ end }}
