{{ define "page" }}
	<div class="card shadow-sm">
		<div class="card-header flex-row gap-4 align-items-center justify-content-between">
			{{ .Org.Name }}
		</div>
		<div class="card-body">
			<p>id: {{ .Org.Id }}</p>
			{{ if not (eq .Org.Address nil) }}
				<p>Адрес: {{ .Org.Address }}</p>
			{{ end }}
		</div>
		<div class="card-footer">
			<a href="/" class="btn-solid theme-primary">
				<i class="bi bi-arrow-left"></i>
				Назад
			</a>
		</div>
	</div>
{{ end }}
