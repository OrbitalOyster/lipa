{{ define "page" }}
	<div class="d-flex vh-100">
		<main class="m-auto w-fit">
			<div class="card shadow-sm">
				<form
					hx-disabled-elt=".htmx-disable"
					hx-indicator="#login-btn-icon"
					hx-post="/login"
					hx-swap="none"
				>
					<div class="card-header d-flex flex-row justify-content-between align-items-center">
						<div class="d-flex flex-column">
							<h4>
								Lipa
							</h4>
							<h6 class="fg-secondary">
								Made by so-called "free thinkers"
							</h6>
						</div>
						<!-- The Goose -->
						<img
							class="logo"
							src="/img/goose.webp"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-bs-title="It's the Goose"
						/>
					</div>
					<div class="card-body">
						<div class="d-flex flex-column gap-2">
							<!-- Username -->
							<div class="input-group">
								<!-- Cute icon -->
								<i class="input-group-text bi bi-person-fill fs-lg fg-secondary"></i>
								<div class="form-floating">
									<label for="username" class="fg-secondary">
										Username
									</label>
									<input
										class="form-control htmx-disable"
										type="text"
										id="username"
										name="username"
										autocomplete="username"
										placeholder=""
										size="48"
										autofocus
									>
								</div>
							</div>
							<!-- Password -->
							<div class="input-group htmx-disable">
								<!-- Another cute icon -->
								<i class="input-group-text bi bi-lock-fill fs-lg fg-secondary"></i>
								<div class="form-floating">
									<label for="password-input" class="fg-secondary">
										Password
									</label>
									<input
										class="form-control htmx-disable"
										type="password"
										id="password-input"
										name="password"
										autocomplete="current-password"
										placeholder=""
										data-bs-attribute="type"
										data-bs-value="password"
									>
								</div>
								<!-- Show/hide password -->
								<button
									class="theme-primary btn-solid input-group-btn htmx-disable"
									type="button"
									data-bs-toggle="toggler"
									data-bs-target="#password-input"
								>
									<i class="bi bi-eye-fill fs-lg"></i>
								</button>
							</div>
						</div>
					</div>
					<div class="card-footer d-flex flex-row align-items-center justify-content-between">
						<!-- Remember me -->
						<div class="form-field">
							<input
								class="check theme-primary htmx-disable"
								type="checkbox"
								id="remember-me"
								name="remember-me"
								value="true"
							>
							<label for="remember-me">
								Remember me
							</label>
						</div>
						<!-- Switch users/orgs -->
						<div class="form-field">
							<div class="switch theme-primary">
								<input
									type="checkbox"
									name="user-org"
									value="true"
									id="switch-user-org"
									role="switch"
									switch
								>
							</div>
							<label for="switch-user-org">
								Switch me
							</label>
						</div>
						<!-- Log in button -->
						<button class="theme-primary btn-solid htmx-disable" type="submit">
							<i class="bi bi-box-arrow-in-right"	id="login-btn-icon"></i>
							<span class="spinner-border spinner-border-sm"></span>
							Log in
						</button>
					</div>
				</form>
			</div>
			<div class="text-end p-2">
				<i class="bi bi-c-circle"></i>
				{{ .Year }}
			</div>
		</main>
	</div>
{{ end }}
