{{ define "page" }}
	<div class="card shadow-sm">
		<div class="card-header flex-row gap-4 align-items-center justify-content-between">
			Файлики
			<a href="/upload-xlsx">
				Загрузить
			</a>
		</div>
		<div class="card-body">
			<table class="table">
				<thead>
					<th class="text-center">Имя файла</th>
					<th class="text-center">Хэш</th>
					<th class="text-center">Действия</th>
				</thead>
				<tbody>
					{{ range .XLSXs }}
						<tr>
							<td>{{ .Filename }}</td>
							<td>{{ .Hash }}</td>
							<td class="text-center">
								<i class="bi bi-three-dots-vertical"></i>
							</td>
						</tr>
					{{ end }}
				</tbody>
			</table>
		</div>
	</div>
{{ end }}
