{{ define "navbar.html" }}
	{{ template "breadcrumb.html" . }}
	<div>
		{{ l "LoggedInAs" }}: <strong>{{ .Username }}</strong>
		<button
			class="btn-solid theme-warning"
			type="button"
			hx-post="/logout"
			hx-confirm="{{ l "ConfirmLogout" }}"
		>
			<i class="bi bi-box-arrow-right"></i>
			{{ l "LogOut" }}
		</button>
	</div>
{{ end }}
