{{ define "org-list.html" }}
	<div class="list-group list-group-flush" id="org-list">
		{{ range .Orgs }}
		<a
			href="/orgs/{{ .Id }}"
			class=" list-group-item list-group-item-action {{ if not .Active }} text-decoration-line-through {{ end }}"
		>
			{{ .Id }} - {{ .Name }}
		</a>
		{{ end }}
	</div>
{{ end }}
