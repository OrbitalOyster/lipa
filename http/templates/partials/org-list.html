{{ define "org-list" }}
	<div class="list-group list-group-flush">
		{{ range . }}
			<a
				href="/orgs/{{ .Id }}"
				class="list-group-item
				list-group-item-action
				{{ if not .Active }} text-decoration-line-through {{ end }}"
			>
				{{ .Id }} - {{ .Name }}
			</a>
		{{ end }}
	</div>
{{ end }}
