services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ}
    volumes:
      - ${DATA_FOLDER}/db:/var/lib/postgresql/data/pgdata
    ports:
      - ${DB_EXTERNAL_PORT}:${DB_PORT}

  http:
    build: http
    environment:
      PORT: ${HTTP_PORT}
      GIN_MODE: ${GIN_MODE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      COOKIE_NAME: ${COOKIE_NAME}
      COOKIE_LIFETIME: ${COOKIE_LIFETIME}
      COOKIE_LONG_LIFETIME: ${COOKIE_LONG_LIFETIME}
      TOKEN_SECRET: ${TOKEN_SECRET}
      TZ: ${TZ}
    depends_on:
      - db

  nginx:
    image: nginx
    environment:
      HTTP_HOST: http
      HTTP_PORT: ${HTTP_PORT}
      TZ: ${TZ}
    volumes:
      - ./nginx-templates:/etc/nginx/templates
      - ./static:/usr/share/nginx/html
    ports:
      - ${PORT}:${HTTP_PORT}
    depends_on:
      - http
