worker_processes 8;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  charset       utf-8;
  keepalive_timeout  60;
  gzip on;
  gzip_types  text/plain application/javascript application/x-javascript text/javascript text/css;

  server {
    listen 80;

    # Root path
    location / {
        proxy_pass http://http;
        proxy_cache off;
    }

    # Favicon
    location /favicon.ico {
      alias /usr/share/nginx/html/favicon.ico;
    }

    # Static files
    location /css/ {
      alias /usr/share/nginx/html/css/;
    }

    location /js/ {
      alias /usr/share/nginx/html/js/;
    }

    location /img/ {
      alias /usr/share/nginx/html/img/;
    }

    # Vendor static files
    location /bootstrap/ {
      alias /usr/share/nginx/html/vendor/bootstrap/dist/;
    }

    location /bootstrap-icons/ {
      alias /usr/share/nginx/html/vendor/bootstrap-icons/font/;
    }

    location /htmx/ {
      alias /usr/share/nginx/html/vendor/htmx/dist/;
    }

    # All errors from proxied API redirect to custom error page
    proxy_intercept_errors on;
    error_page 404 403 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/;
        internal;
    }

  }
}
